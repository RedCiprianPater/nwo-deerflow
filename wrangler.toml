name = "nwo-deerflow-tool20"
main = "worker/worker.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "DEERFLOW_CACHE"
id = "192b83585c7e401da85a83c3a6888a9f"

[vars]
DEERFLOW_API_BASE = "https://nwo-deerflow.onrender.com"
CONWAY_RELAYER_URL = "https://nwo-conway-relayer.onrender.com"
NWO_AGENT_RUNNER_VERSION = "6.1.0"

# Secrets — set via: wrangler secret put <NAME>
#   DEERFLOW_API_KEY        (optional; only if your Render service sets DEERFLOW_API_KEY)
#   WORKER_ENCRYPTION_KEY   (required by the Env interface)

[triggers]
crons = ["0 */6 * * *"]   # KV cleanup every 6h; remove if you drop scheduled()

[build]
command = ""

[env.dev]
name = "nwo-deerflow-tool20-dev"
[env.dev.vars]
DEERFLOW_API_BASE = "https://nwo-deerflow.onrender.com"
CONWAY_RELAYER_URL = "https://nwo-conway-relayer.onrender.com"
NWO_AGENT_RUNNER_VERSION = "6.1.0"

[env.staging]
name = "nwo-deerflow-tool20-staging"

[env.production]
name = "nwo-deerflow-tool20"
